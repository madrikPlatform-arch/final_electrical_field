<style>
  :root {
    --primary-blue: #1e3a8a;
    --blue-600: #2563eb;
    --teal: #0d9488;
    --teal-dark: #0f766e;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --bad: #dc2626;
    --bad-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(180deg, #e0f2fe 0%, var(--bg) 260px);
    color: var(--text);
    line-height: 1.8;
    min-height: 100vh;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 16px 14px 48px; }

  /* ---------- Header ---------- */
  .site-header {
    background: linear-gradient(135deg, var(--primary-blue), var(--teal));
    color: #fff;
    border-radius: 18px;
    padding: 22px 18px;
    text-align: center;
    box-shadow: 0 10px 24px rgba(30, 58, 138, .25);
    margin-bottom: 18px;
  }
  .site-header h1 { margin: 0 0 4px; font-size: 1.7rem; font-weight: 800; }
  .site-header p { margin: 0; opacity: .92; font-size: .95rem; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 16px;
    box-shadow: 0 2px 10px rgba(15, 23, 42, .05);
  }
  .hidden { display: none !important; }

  /* ---------- Login ---------- */
  #login-section { max-width: 440px; margin: 28px auto 0; text-align: center; }
  #login-section h2 { margin: 0 0 6px; color: var(--primary-blue); font-size: 1.3rem; }
  #login-section p.sub { margin: 0 0 18px; color: var(--muted); font-size: .92rem; }
  .field {
    width: 100%;
    padding: 13px 14px;
    font: inherit;
    font-size: 1.1rem;
    text-align: center;
    border: 2px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: #f8fafc;
    transition: border-color .15s, box-shadow .15s;
  }
  .field:focus { border-color: var(--blue-600); box-shadow: 0 0 0 4px rgba(37, 99, 235, .12); background: #fff; }
  .btn {
    display: inline-block;
    width: 100%;
    margin-top: 14px;
    padding: 13px 16px;
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    background: linear-gradient(135deg, var(--primary-blue), var(--blue-600));
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .08s, opacity .15s;
  }
  .btn:active { transform: scale(.985); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn.teal { background: linear-gradient(135deg, var(--teal-dark), var(--teal)); }
  #login-error { color: var(--bad); font-weight: 700; min-height: 1.6em; margin-top: 12px; }

  /* ---------- Exam top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, .96);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, .08);
  }
  #welcome { font-weight: 700; color: var(--primary-blue); font-size: 1rem; }
  .timer {
    direction: ltr;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    color: var(--teal-dark);
    background: #ccfbf1;
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .progress { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin: -4px 4px 14px; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--blue-600)); transition: width .25s; }

  /* ---------- Result banner ---------- */
  #result-banner {
    text-align: center;
    color: #fff;
    border-radius: 18px;
    padding: 22px 16px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--primary-blue), var(--teal));
    box-shadow: 0 10px 24px rgba(30, 58, 138, .25);
  }
  #result-banner .label { opacity: .9; font-size: .95rem; }
  #result-banner .score { font-size: 2.6rem; font-weight: 800; line-height: 1.3; direction: ltr; }
  #result-banner .pct { font-size: 1.05rem; font-weight: 700; }
  #sync-status { margin-top: 10px; font-size: .92rem; background: rgba(255,255,255,.18); display: inline-block; padding: 4px 14px; border-radius: 99px; }
  #retry-btn { margin-top: 10px; width: auto; padding: 8px 18px; font-size: .95rem; background: #fff; color: var(--primary-blue); }

  /* ---------- Questions ---------- */
  .q-card { margin-bottom: 14px; scroll-margin-top: 80px; }
  .q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .q-num {
    flex: none;
    background: var(--primary-blue);
    color: #fff;
    font-weight: 800;
    font-size: .85rem;
    padding: 2px 12px;
    border-radius: 99px;
  }
  .q-text { font-weight: 600; font-size: 1.03rem; }
  .stmts { margin-top: 8px; font-weight: 400; display: grid; gap: 4px; }
  .stmts b { color: var(--primary-blue); }
  .q-img-wrap { text-align: center; margin: 10px 0 12px; }
  .q-img-wrap img {
    max-width: 100%;
    max-height: 340px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: zoom-in;
  }
  .options { display: grid; gap: 8px; margin-top: 8px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    background: #f8fafc;
    transition: border-color .12s, background .12s;
  }
  .opt:hover { border-color: #93c5fd; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .letter {
    flex: none;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: #e2e8f0;
    color: var(--primary-blue);
    font-weight: 800;
    font-size: .9rem;
  }
  .opt .otext { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; }
  .opt .optimg { text-align: center; }
  .opt .optimg img {
    max-width: 100%;
    max-height: 150px;
    background: #fff;
    border-radius: 8px;
    border: 1px solid var(--border);
    vertical-align: middle;
  }
  .opt .missing { color: var(--muted); font-size: .85rem; }
  .opt:has(input:checked) { border-color: var(--blue-600); background: #eff6ff; }
  .opt:has(input:checked) .letter { background: var(--blue-600); color: #fff; }
  .opt:has(input:focus-visible) { outline: 3px solid rgba(37, 99, 235, .35); }

  .q-card.locked .opt { cursor: default; }
  .q-card.locked .opt:hover { border-color: var(--border); }
  .opt.correct { border-color: var(--ok) !important; background: var(--ok-bg) !important; }
  .opt.correct .letter { background: var(--ok) !important; color: #fff !important; }
  .opt.wrong { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
  .opt.wrong .letter { background: var(--bad) !important; color: #fff !important; }

  .feedback { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: .95rem; }
  .feedback.ok { background: var(--ok-bg); color: #14532d; }
  .feedback.bad { background: var(--bad-bg); color: #7f1d1d; }
  .feedback .fb-title { font-weight: 800; margin-bottom: 2px; }
  .feedback .fb-explain { color: var(--text); }

  .submit-wrap { margin-top: 8px; }
  #submit-msg { text-align: center; color: var(--muted); margin-top: 8px; min-height: 1.5em; font-size: .92rem; }

  mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }

  /* ---------- Lightbox ---------- */
  #lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(15, 23, 42, .88);
    display: none; align-items: center; justify-content: center;
    padding: 16px; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; background: #fff; }

  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 26px; }

  @media (min-width: 640px) {
    .site-header h1 { font-size: 2.1rem; }
    .card { padding: 24px 24px; }
    .q-text { font-size: 1.1rem; }
    .options.grid-img { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="site-header">
    <h1>المجالات الكهربائية وقانون جاوس</h1>
    <p id="meta-line"></p>
  </header>

  <!-- ===================== تسجيل الدخول ===================== -->
  <section id="login-section" class="card">
    <h2>تسجيل الدخول للامتحان</h2>
    <p class="sub">أدخل كود الطالب الخاص بك للبدء</p>
    <input id="student-id" class="field" type="text" inputmode="numeric" autocomplete="off"
           placeholder="كود الطالب (مثال: 18)" aria-label="كود الطالب">
    <button id="login-btn" class="btn">تحقق ودخول</button>
    <div id="login-error" role="alert"></div>
  </section>

  <!-- ===================== الامتحان ===================== -->
  <section id="exam-section" class="hidden">
    <div class="topbar">
      <div id="welcome"></div>
      <div class="timer" id="timer">00:00</div>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>

    <div id="result-banner" class="hidden"></div>

    <div id="questions"></div>

    <div class="submit-wrap">
      <button id="submit-btn" class="btn teal">إنهاء الامتحان وإرسال النتيجة</button>
      <div id="submit-msg"></div>
    </div>
  </section>

  <footer>المجالات الكهربائية وقانون جاوس • بالتوفيق للجميع</footer>
</div>

<div id="lightbox" aria-hidden="true"><img alt=""></div>

<script>
/* =====================================================================
   الإعدادات
   ===================================================================== */
const EXAM_META = {
  subject: "فيزياء",
  module: "الكهروستاتيكية",
  lesson: "اختبار على حالات خاصة في تماثل توزيع الشحنات (2.9)",
  type: "اختبار"
};
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSAFcPEXqQfaFu4P2x1XTgBNsWb_V7OA9AjW_5HBfKB17nL_YcY4iE58AH3bObx5k/exec";

/* الصور داخل مجلد img — اسم الملف = رقم السؤال (مثل img/5.jpg)
   وصور الخيارات: img/4a.png ، img/4b.png ، img/4c.png ، img/4d.png            */
const IMG_DIR = "img";
const IMG_EXTS = ["png", "jpg", "jpeg", "webp", "gif", "svg", "PNG", "JPG", "JPEG", "WEBP"];

/* =====================================================================
   بنك الأسئلة
   img     = اسم ملف الشكل الرئيسي (بدون امتداد)
   optImgs = أسماء ملفات صور الخيارات (إن كانت الخيارات صوراً)
   tag     = نقطة الضعف التي تُسجَّل عند الخطأ
   ===================================================================== */
const QUESTIONS = [
  {
    label: "1", img: null, tag: "المجال الناتج عن سلك لا نهائي (معنى الرمز ووحدته)",
    text: String.raw`ماذا يمثل \(X\) في الصيغة \(\left(E=\dfrac{2kX}{y}\right)\) لسلك لانهائي وما هي وحدة قياسها؟`,
    options: [
      String.raw`كثافة الشحنة الخطية ، الوحدة \(\text{C/m}\)`,
      String.raw`كثافة الشحنة السطحية ، الوحدة \(\text{C/m}^2\)`,
      String.raw`كثافة الشحنة الحجمية ، الوحدة \(\text{C/m}^3\)`,
      String.raw`كثافة الشحنة الحجمية ، الوحدة \(\text{C/m}^4\)`
    ],
    answer: 0,
    explain: String.raw`مجال سلك لانهائي مشحون: \(E=\dfrac{2k\lambda}{y}\)، إذن \(X=\lambda\) هي كثافة الشحنة الخطية (شحنة لكل وحدة طول) ووحدتها \(\text{C/m}\).`
  },
  {
    label: "2", img: null, tag: "حساب المجال الناتج عن سلك طويل مشحون",
    text: String.raw`وُضع إجمالي \(1.45\times10^{6}\) من الإلكترونات الفائضة على سلك متعادل كهربائياً في البداية طوله \(1.13\,\text{m}\). ما مقدار المجال الكهربائي عند نقطة على مسافة عمودية \(0.401\,\text{m}\) من منتصف السلك؟ (تلميح: افترض أن الطول \(1.13\,\text{m}\) قريب بما يكفي من "الطول اللانهائي")`,
    options: [
      String.raw`\(9.21\times10^{-3}\,\text{N/C}\)`,
      String.raw`\(2.92\times10^{-1}\,\text{N/C}\)`,
      String.raw`\(6.77\times10^{1}\,\text{N/C}\)`,
      String.raw`\(8.12\times10^{2}\,\text{N/C}\)`
    ],
    answer: 0,
    explain: String.raw`\(\lambda=\dfrac{Ne}{L}=\dfrac{(1.45\times10^{6})(1.602\times10^{-19})}{1.13}=2.06\times10^{-13}\,\text{C/m}\). \(E=\dfrac{2k\lambda}{y}=\dfrac{2(8.99\times10^{9})(2.06\times10^{-13})}{0.401}=9.2\times10^{-3}\,\text{N/C}\).`
  },
  {
    label: "3", img: null, tag: "نوع توزيع الشحنة وعدد الإلكترونات لكل وحدة طول",
    text: String.raw`ينتج سلك مشحون ذو طول لانهائي مجالاً كهربائياً مقداره \(1.23\times10^{3}\,\text{N/C}\) على مسافة عمودية \(50.0\,\text{cm}\) من السلك، ويتجه المجال نحو السلك. (أ) ما توزيع الشحنة؟ (ب) كم عدد الإلكترونات لكل وحدة طول على السلك؟`,
    options: [
      String.raw`(أ) شحنة موجبة ، (ب) \(2.14\times10^{11}\) إلكترون/m`,
      String.raw`(أ) شحنة سالبة ، (ب) \(4.27\times10^{11}\) إلكترون/m`,
      String.raw`(أ) شحنة سالبة ، (ب) \(2.14\times10^{11}\) إلكترون/m`,
      String.raw`(أ) شحنة سالبة ، (ب) \(1.07\times10^{11}\) إلكترون/m`
    ],
    answer: 2,
    explain: String.raw`المجال يتجه نحو السلك إذن الشحنة سالبة. \(\lambda=\dfrac{Ey}{2k}=\dfrac{(1.23\times10^{3})(0.50)}{2(8.99\times10^{9})}=3.42\times10^{-8}\,\text{C/m}\)، وعدد الإلكترونات لكل متر \(=\dfrac{\lambda}{e}=\dfrac{3.42\times10^{-8}}{1.6\times10^{-19}}\approx2.14\times10^{11}\).`
  },
  {
    label: "4", img: null, tag: "توزيع الشحنة على موصل كروي",
    text: "افترض أن كرة فولاذية مصمتة وغير مشحونة، كإحدى الكرات الفولاذية المستخدمة في لعبة الكرة والدبابيس القديمة، موضوعة أو مستقرة على عازل مثالي. ثم وُضعت كمية صغيرة من الشحنة السالبة (مئات الإلكترونات مثلاً) عند القطب الشمالي للكرة. إذا أمكنك التحقق من توزيع الشحنة بعد ثوانٍ قليلة، فماذا ستكتشف؟",
    options: [
      "اختفت كل الشحنة المضافة وأصبحت الكرة متعادلة كهربائياً مرة أخرى",
      "انتقلت كل الشحنة المضافة إلى مركز الكرة",
      "وُزعت كل الشحنة المضافة بانتظام على سطح الكرة",
      "لازالت الشحنة المضافة موجودة في مكانها عند القطب الشمالي للكرة أو قريبة جداً منه"
    ],
    answer: 2,
    explain: "الفولاذ موصل، فتتنافر الإلكترونات المضافة وتتحرك بحرية حتى تستقر على السطح الخارجي، وبسبب تماثل الكرة تتوزع بانتظام على سطحها. الشحنة لا تختفي (قانون حفظ الشحنة) ولا تبقى داخل الموصل."
  },
  {
    label: "5", img: null, tag: "توزيع الشحنة على عازل كروي",
    text: "افترض أن كرة مجوفة غير مشحونة مصنوعة من عازل مثالي، ككرة البنج بونج، مستقرة على عازل مثالي. ثم وُضعت كمية صغيرة من الشحنة السالبة (مئات الإلكترونات مثلاً) عند القطب الشمالي للكرة. إذا أمكنك التحقق من توزيع الشحنة بعد ثوانٍ قليلة، فماذا ستكتشف؟",
    options: [
      "اختفت كل الشحنة المضافة وأصبحت الكرة متعادلة كهربائياً مرة أخرى",
      "انتقلت كل الشحنة المضافة إلى مركز الكرة",
      "وُزعت كل الشحنة المضافة بانتظام على سطح الكرة",
      "لازالت الشحنة المضافة موجودة في مكانها عند القطب الشمالي للكرة أو قريبة جداً منه"
    ],
    answer: 3,
    explain: "المادة عازلة، فالشحنات لا تستطيع الانتقال خلالها أو على سطحها بحرية، لذلك تبقى الشحنة المضافة في مكانها عند القطب الشمالي أو قريبة جداً منه (بخلاف الموصل الذي تتوزع فيه الشحنة)."
  },
  {
    label: "6", img: null, tag: "الشحنة المحتثة على سطحي هيكل موصل",
    text: String.raw`وُضعت شحنة \(+2q\) في مركز هيكل موصل غير مشحون. ما الشحنات التي ستكون موجودة على السطح الداخلي والخارجي للهيكل، على التوالي؟`,
    options: [
      String.raw`\(-2q\) ، \(+2q\)`,
      String.raw`\(-q\) ، \(+q\)`,
      String.raw`\(+2q\) ، \(-2q\)`,
      String.raw`\(-2q\) ، \(+4q\)`
    ],
    answer: 0,
    explain: String.raw`المجال داخل الموصل صفر، فيحتث السطح الداخلي شحنة \(-2q\) (تلغي مجال الشحنة المركزية داخل الموصل). والهيكل غير مشحون (صافي صفر) فيحمل السطح الخارجي \(+2q\).`
  },
  {
    label: "7", img: "7", tag: "المجال الناتج عن لوحين لانهائيين غير موصلين",
    text: String.raw`لوحان لانهائيان غير موصلين يوازي كل منهما الآخر وتفصل بينهما مسافة \(d=10\,\text{cm}\) كما هو موضح في الشكل. إذا كان كل لوح يحمل توزيع شحنة منتظماً مقداره \(\sigma=4.5\,\mu\text{C/m}^2\)، فما المجال الكهربائي عند النقطة \(P\) (إذا كان \(x_P=20\,\text{cm}\))؟`,
    options: [
      String.raw`\(2.54\,\hat{x}\ \text{N/C}\)`,
      String.raw`\((-5.08\times10^{5})\,\hat{x}\ \text{N/C}\)`,
      String.raw`\((5.08\times10^{5})\,\hat{x}\ \text{N/C}\)`,
      String.raw`\((-1.02\times10^{5})\,\hat{x}\ \text{N/C}\)`
    ],
    answer: 2,
    explain: String.raw`مجال لوح لانهائي غير موصل \(E=\dfrac{\sigma}{2\varepsilon_0}=\dfrac{4.5\times10^{-6}}{2(8.85\times10^{-12})}=2.54\times10^{5}\,\text{N/C}\). النقطة \(P\) على يمين اللوحين الموجبين، فمجال كل منهما في اتجاه \(+x\) ويتجمعان: \(E=2(2.54\times10^{5})=5.08\times10^{5}\,\hat{x}\,\text{N/C}\).`

    // MathJax لم يُحمَّل بعد: ننتظر انتهاء التحميل
    window.addEventListener("load", () => {
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(nodes).catch(() => {});
    }, { once: true });
  }
}

function fmtTime(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}

/* =====================================================================
   تسجيل الدخول (GET)
   ===================================================================== */
async function login() {
  const errEl = $("login-error");
  const btn = $("login-btn");
  const id = $("student-id").value.trim();
  errEl.textContent = "";

  if (!id) { errEl.textContent = "من فضلك أدخل كود الطالب."; return; }

  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = "جارٍ التحقق...";

  try {
    const res = await fetch(`${SCRIPT_URL}?student_id=${encodeURIComponent(id)}`, { method: "GET", redirect: "follow" });
    const data = await res.json();

    if (data && data.valid === true) {
      studentId = id;
      studentName = data.student_name || "";
      startExam();
    } else {
      errEl.textContent = (data && data.error) ? data.error : "الكود غير مسجل في قاعدة البيانات.";
    }
  } catch (e) {
    errEl.textContent = "تعذر الاتصال بالخادم. تأكد من الإنترنت وحاول مرة أخرى.";
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

/* =====================================================================
   تحميل الصور (يجرّب الامتدادات تلقائياً)
   ===================================================================== */
function tryLoadImage(name, alt, onOk, onFail) {
  let i = 0;
  const img = new Image();
  img.alt = alt;
  img.onload = () => onOk(img);
  img.onerror = () => {
    i++;
    if (i < IMG_EXTS.length) img.src = `${IMG_DIR}/${name}.${IMG_EXTS[i]}`;
    else if (onFail) onFail();
  };
  img.src = `${IMG_DIR}/${name}.${IMG_EXTS[0]}`;
}

function loadMainImage(wrap, name) {
  tryLoadImage(name, `شكل السؤال ${name}`, (img) => {
    img.addEventListener("click", () => openLightbox(img.src));
    wrap.appendChild(img);
    wrap.classList.remove("hidden");
  });
  /* لا توجد صورة لهذا السؤال: يبقى الحاوي مخفياً */
}

function loadOptionImage(holder, name, letter) {
  tryLoadImage(name, `الشكل (${letter})`, (img) => {
    holder.textContent = "";
    holder.appendChild(img);
  }, () => {
    holder.innerHTML = `<span class="missing">الشكل (${letter}) — الصورة غير موجودة: ${IMG_DIR}/${name}</span>`;
  });
}

/* =====================================================================
   عرض الامتحان
   ===================================================================== */
function buildQuestions() {
  const root = $("questions");
  root.innerHTML = "";

  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement("article");
    card.className = "card q-card";
    card.dataset.index = idx;
    card.dataset.tag = q.tag;

    const hasOptImgs = Array.isArray(q.optImgs) && q.optImgs.length > 0;

    const opts = q.options.map((o, i) => `
      <label class="opt" data-i="${i}">
        <input type="radio" name="q${idx}" value="${i}">
        <span class="letter">${LETTERS[i]}</span>
        <span class="otext${hasOptImgs ? " optimg" : ""}">${o}</span>
      </label>`).join("");

    card.innerHTML = `
      <div class="q-head"><span class="q-num">السؤال ${q.label}</span></div>
      <div class="q-text">${q.text}</div>
      <div class="q-img-wrap hidden"></div>
      <div class="options${hasOptImgs ? " grid-img" : ""}">${opts}</div>
      <div class="feedback hidden"></div>`;

    root.appendChild(card);

    if (q.img) loadMainImage(card.querySelector(".q-img-wrap"), q.img);
    if (hasOptImgs) {
      card.querySelectorAll(".optimg").forEach((holder, i) => {
        loadOptionImage(holder, q.optImgs[i], LETTERS[i]);
      });
    }
  });

  root.addEventListener("change", updateProgress);
  typeset([root]);
}

function updateProgress() {
  let answered = 0;
  QUESTIONS.forEach((_, idx) => {
    if (document.querySelector(`input[name="q${idx}"]:checked`)) answered++;
  });
  $("progress-bar").style.width = (answered / QUESTIONS.length * 100) + "%";
  if (!submitted) $("submit-msg").textContent = `تمت الإجابة على ${answered} من ${QUESTIONS.length}`;
}

function startExam() {
  $("login-section").classList.add("hidden");
  $("exam-section").classList.remove("hidden");
  $("welcome").textContent = `مرحباً بك: ${studentName}`;

  buildQuestions();
  updateProgress();

  examActive = true;
  startTime = Date.now();
  timerHandle = setInterval(() => {
    $("timer").textContent = fmtTime(Math.floor((Date.now() - startTime) / 1000));
  }, 1000);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =====================================================================
   التصحيح والإرسال (POST)
   ===================================================================== */
/* نص الخيار كما يُسجَّل في الشيت (بدون وسوم HTML أو علامات MathJax) */
function plain(html, q, i) {
  if (Array.isArray(q.optImgs) && q.optImgs.length) return `الشكل (${LETTERS[i]}) - ${q.optImgs[i]}`;
  return String(html)
    .replace(/<[^>]*>/g, "")
    .replace(/\\\(|\\\)/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function gradeExam() {
  let score = 0;
  const weaknesses = new Set();
  const details = [];

  QUESTIONS.forEach((q, idx) => {
    const card = document.querySelector(`.q-card[data-index="${idx}"]`);
    const checked = card.querySelector(`input[name="q${idx}"]:checked`);
    const selected = checked ? parseInt(checked.value, 10) : -1;
    const isCorrect = selected === q.answer;
    if (isCorrect) score++; else weaknesses.add(q.tag);

    details.push({
      question: q.label,
      selected: selected >= 0 ? LETTERS[selected] : null,
      selectedText: selected >= 0 ? plain(q.options[selected], q, selected) : "",
      correct: LETTERS[q.answer],
      correctText: plain(q.options[q.answer], q, q.answer),
      isCorrect,
      tag: q.tag
    });
  });

  return { score, weaknesses: [...weaknesses], details };
}

function showFeedback() {
  QUESTIONS.forEach((q, idx) => {
    const card = document.querySelector(`.q-card[data-index="${idx}"]`);
    card.classList.add("locked");
    card.querySelectorAll("input").forEach((i) => (i.disabled = true));

    const checked = card.querySelector(`input[name="q${idx}"]:checked`);
    const selected = checked ? parseInt(checked.value, 10) : -1;
    const ok = selected === q.answer;

    card.querySelectorAll(".opt").forEach((el) => {
      const i = parseInt(el.dataset.i, 10);
      if (i === q.answer) el.classList.add("correct");
      else if (i === selected) el.classList.add("wrong");
    });

    const fb = card.querySelector(".feedback");
    fb.classList.remove("hidden", "ok", "bad");
    fb.classList.add(ok ? "ok" : "bad");
    const title = ok
      ? "✅ إجابة صحيحة"
      : (selected === -1
          ? `❌ لم تجب على هذا السؤال — الإجابة الصحيحة: ${LETTERS[q.answer]}`
          : `❌ إجابة خاطئة — الإجابة الصحيحة: ${LETTERS[q.answer]}`);
    fb.innerHTML = `<div class="fb-title">${title}</div><div class="fb-explain">${q.explain}</div>`;
  });
  typeset([$("questions")]);
}

function showBanner(score, total, timeSeconds) {
  const pct = Math.round((score / total) * 100);
  const banner = $("result-banner");
  banner.classList.remove("hidden");
  banner.innerHTML = `
    <div class="label">نتيجتك يا ${studentName}</div>
    <div class="score">${score} / ${total}</div>
    <div class="pct">${pct}% • الوقت: ${fmtTime(timeSeconds)}</div>
    <div id="sync-status">جارٍ حفظ النتيجة...</div>
    <div><button id="retry-btn" class="btn hidden">إعادة محاولة الحفظ</button></div>`;
  $("retry-btn").addEventListener("click", () => sendResult(lastPayload));
}

function setSync(msg) { const el = $("sync-status"); if (el) el.textContent = msg; }

async function sendResult(payload) {
  const retry = $("retry-btn");
  if (retry) retry.classList.add("hidden");
  setSync("جارٍ حفظ النتيجة...");

  const body = JSON.stringify(payload);
  try {
    /* text/plain يتجنب طلب preflight مع Google Apps Script */
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body,
      redirect: "follow"
    });
    let data = null;
    try { data = await res.json(); } catch (_) { /* قد لا يكون الرد JSON */ }

    if (res.ok && !(data && (data.error || data.success === false))) {
      setSync("✅ تم حفظ نتيجتك بنجاح");
    } else {
      setSync("⚠️ تعذر حفظ النتيجة: " + ((data && data.error) || "خطأ في الخادم"));
      if (retry) retry.classList.remove("hidden");
    }
  } catch (e) {
    /* احتمال حجب CORS: نعيد الإرسال بوضع no-cors (لا يمكن قراءة الرد) */
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body
      });
      setSync("✅ تم إرسال نتيجتك");
    } catch (e2) {
      setSync("⚠️ تعذر الاتصال بالخادم، لم يتم حفظ النتيجة");
      if (retry) retry.classList.remove("hidden");
    }
  }
}

async function submitExam() {
  if (submitted) return;

  let unanswered = 0;
  QUESTIONS.forEach((_, idx) => {
    if (!document.querySelector(`input[name="q${idx}"]:checked`)) unanswered++;
  });
  if (unanswered > 0 &&
      !confirm(`لم تجب على ${unanswered} سؤال/أسئلة. هل تريد إنهاء الامتحان وإرسال النتيجة؟`)) return;

  const btn = $("submit-btn");
  btn.disabled = true;
  btn.textContent = "جارٍ التصحيح والإرسال...";

  submitted = true;
  examActive = false;
  clearInterval(timerHandle);
  const timeSeconds = Math.floor((Date.now() - startTime) / 1000);

  const { score, weaknesses, details } = gradeExam();
  const total = QUESTIONS.length;

  showFeedback();
  showBanner(score, total, timeSeconds);
  $("submit-msg").textContent = "";
  btn.classList.add("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });

  lastPayload = {
    studentId: String(studentId),
    subject: EXAM_META.subject,
    module: EXAM_META.module,
    lesson: EXAM_META.lesson,
    assessmentType: EXAM_META.type,
    score,
    total,
    timeSeconds,
    weaknesses,
    details
  };
  await sendResult(lastPayload);
}

/* =====================================================================
   تكبير الصور
   ===================================================================== */
function openLightbox(src) {
  const lb = $("lightbox");
  lb.querySelector("img").src = src;
  lb.classList.add("open");
  lb.setAttribute("aria-hidden", "false");
}
$("lightbox").addEventListener("click", () => {
  $("lightbox").classList.remove("open");
  $("lightbox").setAttribute("aria-hidden", "true");
});

/* =====================================================================
   ربط الأحداث
   ===================================================================== */
$("login-btn").addEventListener("click", login);
$("student-id").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("submit-btn").addEventListener("click", submitExam);

window.addEventListener("beforeunload", (e) => {
  if (examActive && !submitted) { e.preventDefault(); e.returnValue = ""; }
});
</script>
